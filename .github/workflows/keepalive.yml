name: keepalive

# El cron de GitHub se salta ejecuciones, asi que cada ejecucion hace ping
# durante casi 6 h y despues se relanza a si misma para cubrir el dia entero.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping AutoTube Studio
        run: |
          for i in $(seq 1 68); do
            curl -sS -o /dev/null -w "%{http_code}\n" --max-time 120 --retry 2 https://autotube-studio.onrender.com/api/health || true
            sleep 300
          done
      - name: Relanzar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run keepalive.yml --repo ${{ github.repository }}
